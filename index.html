<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            /* Base Transition */
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. Modern Dark (Default) */
        [data-theme="dark"] {
            --bg-body: #1e293b;
            --bg-card: #334155;
            --bg-header: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-accent: #38bdf8;
            --border-color: #475569;
            --highlight-bg: #475569;
            --button-bg: #38bdf8;
            --button-text: #0f172a;
            --button-hover: #0ea5e9;
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        /* 2. Modern Light */
        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-accent: #2563eb;
            --border-color: #e5e7eb;
            --highlight-bg: #f3f4f6;
            --button-bg: #2563eb;
            --button-text: #ffffff;
            --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5;
            --feedback-success-border: #34d399;
            --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2;
            --feedback-error-border: #f87171;
            --feedback-error-text: #991b1b;
        }

        /* 3. Midnight (Pure Black) */
        [data-theme="midnight"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --text-accent: #90caf9;
            --border-color: #333333;
            --highlight-bg: #1a1a1a;
            --button-bg: #90caf9;
            --button-text: #000000;
            --button-hover: #42a5f5;
            --feedback-success-bg: #051b11;
            --feedback-success-border: #0f5132;
            --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e;
            --feedback-error-border: #842029;
            --feedback-error-text: #ea868f;
        }

        /* 4. Legacy Dark (Original) */
        [data-theme="legacy-dark"] {
            --bg-body: #2d343e;
            --bg-card: #3c424f;
            --bg-header: #3c424f;
            --text-main: #e8e6e3;
            --text-muted: #b0c4de;
            --text-accent: #8ab4f8;
            --border-color: #555;
            --highlight-bg: #454c5a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41;
            --feedback-success-border: #52b788;
            --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129;
            --feedback-error-border: #a4133c;
            --feedback-error-text: #f8d7da;
        }

        /* 5. Sepia (Reading Mode) */
        [data-theme="sepia"] {
            --bg-body: #f4ecd8;
            --bg-card: #fdf6e3;
            --bg-header: #e4d5b7;
            --text-main: #433422;
            --text-muted: #7c6f5a;
            --text-accent: #a05a2c;
            --border-color: #d3c4a5;
            --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c;
            --button-text: #fdf6e3;
            --button-hover: #864822;
            --feedback-success-bg: #e6f4ea;
            --feedback-success-border: #8ab893;
            --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3;
            --feedback-error-border: #d48f8f;
            --feedback-error-text: #5c2b2b;
        }

        /* 6. High Contrast */
        [data-theme="contrast"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-muted: #dddddd;
            --text-accent: #ffff00;
            --border-color: #ffffff;
            --highlight-bg: #333333;
            --button-bg: #ffff00;
            --button-text: #000000;
            --button-hover: #e6e600;
            --feedback-success-bg: #000000;
            --feedback-success-border: #00ff00;
            --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000;
            --feedback-error-border: #ff0000;
            --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Default to Sticky */
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Class to remove sticky behavior */
        header.unpinned {
            position: relative;
            box-shadow: none;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--text-accent);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pin-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .pin-btn:hover {
            background-color: var(--highlight-bg);
        }

        .pin-btn.pin-active {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .theme-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select#theme-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
        }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 600px) {
            header { padding: 1rem; flex-direction: column; gap: 10px; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: space-between; }
            .question-card { padding: 1.5rem; }
            header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Physiology of Shock and Rapid Blood Pressure Control ---
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO1: Summarize how the autonomic nervous system control blood pressure, noting especially the mechanism for [vasodilation], and explain how alpha and beta adrenergic receptors participate in blood pressure control",
                fullLO: "LO1: Summarize how the autonomic nervous system control blood pressure, noting especially the mechanism for vasodilation, and explain how alpha and beta adrenergic receptors participate in blood pressure control",
                question: "A 25-year-old male presents to the emergency department after a motor vehicle accident. He has lost a significant amount of blood. His body initiates rapid compensatory mechanisms to maintain blood pressure. Which of the following best describes the primary mechanism by which the baroreceptor reflex induces systemic vasoconstriction in this patient?",
                options: {
                    A: "Activation of parasympathetic nerves innervating the arterioles",
                    B: "Direct release of acetylcholine on vascular smooth muscle",
                    C: "Increased firing of the carotid sinus nerve",
                    D: "Inhibition of the cardioinhibitory area",
                    E: "Removal of central inhibition on the sympathetic nervous system"
                },
                correctAnswer: "E",
                rationale: "The baroreflex controls blood pressure primarily by modulating the \"brake\" on the sympathetic nervous system (SNS). When blood pressure drops, baroreceptor firing decreases, which reduces the inhibition of the SNS centrally. This allows the SNS to go \"unchecked,\" leading to vasoconstriction. There are no parasympathetic nerves on the vast majority of arterioles.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 28: \"Less inhibition of baseline SNS activity is why SNS output goes up with the baroreflex!... removal of the 'brake', which is described as decreasing the inhibitory signal from the parasympathetic NS, lets the SNS go unchecked.\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO1: Summarize how the autonomic nervous system control blood pressure, noting especially the mechanism for [vasodilation], and explain how alpha and beta adrenergic receptors participate in blood pressure control",
                fullLO: "LO1: Summarize how the autonomic nervous system control blood pressure, noting especially the mechanism for vasodilation, and explain how alpha and beta adrenergic receptors participate in blood pressure control",
                question: "A medical student is reviewing the pharmacology of adrenergic receptors involved in blood pressure control. She notes that epinephrine and norepinephrine have different effects on vascular tone depending on the receptors activated. Which of the following receptor subtypes is primarily responsible for the vasodilation observed in skeletal muscle blood vessels during a \"fight or flight\" response?",
                options: {
                    A: "Alpha-1",
                    B: "Alpha-2",
                    C: "Beta-1",
                    D: "Beta-2",
                    E: "Muscarinic"
                },
                correctAnswer: "D",
                rationale: "Beta-2 receptors are responsible for the vasodilation of most blood vessels (and bronchodilation). Epinephrine activates Beta-2 receptors, whereas norepinephrine has very little action on Beta-2 receptors.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 25: \"beta-2 receptors: - vasodilation of most blood vessels... Norepi has very little action on Beta-2 receptors, but Epi DOES activate B2’s\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO2: Diagram the baroreceptor reflex and be able to use it to explain rapid blood pressure control in response to [changes in blood pressure]",
                fullLO: "LO2: Diagram the baroreceptor reflex and be able to use it to explain rapid blood pressure control in response to increases or decreases in blood pressure",
                question: "A 30-year-old female sustains a deep laceration to her arm and loses approximately 15% of her blood volume. Upon arrival at the hospital, her blood pressure is 115/75 mmHg. Which of the following vital sign findings would best indicate that her baroreceptor reflex is actively compensating for the blood loss?",
                options: {
                    A: "Bradycardia",
                    B: "Decreased respiratory rate",
                    C: "Increased heart rate",
                    D: "Increased pulse pressure",
                    E: "Normal heart rate"
                },
                correctAnswer: "C",
                rationale: "Even if blood pressure is maintained within the normal range, the compensatory mechanism of the baroreflex involves increased sympathetic output and decreased parasympathetic output, which manifests as tachycardia (increased heart rate). A high heart rate in the setting of normal or low-normal BP is a critical clue of active compensation.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Pages 15 & 16: \"The patient’s blood pressure is normal whether they’re intact or bleeding from a flesh wound. But their heart rate is floored (i.e. high) when they’re bleeding. That is how you know that their baroreflex is active... The HR:BP ratio is a critical clue!!!\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO2: Diagram the baroreceptor reflex and be able to use it to explain rapid blood pressure control in response to [changes in blood pressure]",

                    C: "Increased stimulation of the cardioinhibitory area",
                    D: "Inhibition of the vasomotor area",
                    E: "Reduced sympathetic outflow to the heart"
                },
                correctAnswer: "A",
                rationale: "When blood pressure drops (as upon standing), the stretch on the baroreceptors decreases. This leads to a decreased firing rate of the carotid sinus nerve (afferent signal) to the brainstem, which triggers the reflex to increase BP.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 93: \"Decreased blood pressure -> Decreased stretch of the aortic arch and carotid artery -> Decreased firing rate -> Decreased afferent signaling\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO3: Diagram the volume receptor and antidiuretic hormone (vasopressin) response to changes in [blood volume]",

                    C: "Increase in Aldosterone",
                    D: "Increase in Angiotensin II",
                    E: "Increase in Renin"
                },
                correctAnswer: "B",
                rationale: "Increased stretch of volume receptors (located mainly in the right atrium) inhibits the release of Vasopressin (ADH). This decrease in ADH reduces renal water reabsorption, helping to excrete the excess volume.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 40: \"Vasopressin (ADH) release also is inhibited by stretch of these receptors.\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",

                },
                correctAnswer: "C",
                rationale: "With significant decreases in blood pressure, there is a large release of Vasopressin (ADH). While its normal role involves V2 receptors for water retention, at high levels in shock, it causes vasoconstriction by acting on V1 receptors.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 39: \"With significant decreases in blood pressure... there is much greater release of ADH, which causes vasoconstriction by acting on V1 receptors throughout the body.\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO4: Explain the effect of blood pressure and salt intake on activity of the [renin-angiotensin system]",
                fullLO: "LO4: Explain the effect of blood pressure and salt intake on activity of the renin-angiotensin system",
                question: "A healthy individual consumes a low-sodium diet for two weeks. This dietary change leads to decreased NaCl delivery to the macula densa. Which of the following cellular events occurs directly in the juxtaglomerular (JG) cells as a result?",

                    A: "Decreased synthesis of Angiotensinogen",

                    C: "Inhibition of Renin release",
                    D: "Release of Renin",
                    E: "Stimulation of Acetylcholine release"
                },
                correctAnswer: "D",
                rationale: "Low NaCl delivery to the macula densa is one of the three direct controllers of renin secretion. It directly signals the JG cells to release renin.",
                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 34: \"Low NaCl delivery to the macula densa... directly signals the JG cells to release ree’ - nin.\""
            },
            {
                section: "Physiology of Shock and Rapid Blood Pressure Control",
                maskedLO: "LO4: Explain the effect of blood pressure and salt intake on activity of the [renin-angiotensin system]",
                fullLO: "LO4: Explain the effect of blood pressure and salt intake on activity of the renin-angiotensin system",

                source: "Shock_and_Rapid_BP_Control_PDF.pdf, Page 33: \"The cells detect low blood pressure by less stretch, and then they release Ree’ - nin.\""
            },
            {

                question: "In the pathogenesis of ischemic heart disease, the distribution of coronary artery thrombosis coincides with the distribution of atherosclerosis. Which coronary artery is most frequently involved?",

            },
            {
                section: "Cardiac Pathology",
                maskedLO: "LO3: Describe gross and microscopic features of [cardiac event stages].",
                fullLO: "LO3: Describe gross and microscopic features of acute, recent, and old myocardial infarction",
                question: "A patient dies 3 days after the onset of severe chest pain. Histologic examination of the myocardium from the infarcted area would most likely show:",
                options: {

                    C: "Normal myocardium with wavy fibers",
                    D: "Robust neutrophilic infiltrate and coagulative necrosis",

                },
                correctAnswer: "D",
                rationale: "At 24 to 72 hours (1-3 days), the microscopic features are neutrophils and necrosis.",
                source: "Cardiac_Pathology_PDF.pdf, Page 38: \"24 to 72 hours... neutrophils and necrosis on histology\""
            },
            {
                section: "Cardiac Pathology",
                maskedLO: "LO3: Describe gross and microscopic features of [cardiac event stages].",
                fullLO: "LO3: Describe gross and microscopic features of acute, recent, and old myocardial infarction",
                question: "A 65-year-old male dies from a stroke. Review of his history reveals he had a myocardial infarction 10 weeks ago. Examination of the heart at autopsy reveals a firm, white area in the left ventricular wall. Histology of this area would demonstrate:",
                options: {

                    B: "Dense collagen (fibrosis)",

                correctAnswer: "B",
                rationale: "By 8 weeks, a dense scar (fibrosis/collagen deposition) has formed.",
                source: "Cardiac_Pathology_PDF.pdf, Page 39: \"8 weeks... Dense scar(white and firm grossly, dense collagen deposition histologically)\""
            },
            {
                section: "Cardiac Pathology",
                maskedLO: "LO4: Review the various complications of [cardiac event].",

                question: "A 60-year-old male suffers a myocardial infarction. Three days later, he suddenly becomes hypotensive and dies. Autopsy reveals a rupture of the papillary muscle. This complication most likely led to:",
                options: {

                    B: "Acute mitral insufficiency",

                correctAnswer: "B",
                rationale: "Papillary muscle rupture is a complication that can occur around day 3. It leads to mitral insufficiency (regurgitation).",

            {

                options: {

                correctAnswer: "B",

            },
            {
                section: "Cardiac Pathology",
                maskedLO: "LO5: Differentiate [types of] cardiac neoplasms.",
                fullLO: "LO5: Differentiate primary vs metastatic cardiac neoplasms",
                question: "A 45-year-old female presents with episodes of syncope. Echocardiography reveals a mobile mass in the left atrium that intermittently obstructs the mitral valve (\"ball-valve\" effect). Histology of the mass shows multinucleated stellate cells in a myxomatous stroma. What is the diagnosis?",

                    A: "Metastatic tumors to the heart are more common than primary cardiac tumors.",

                source: "Cardiac_Pathology_PDF.pdf, Page 63: \"Metastatic carcinoma to the heart is the most common tumor involving the heart... Primary cardiac tumors are... Very uncommon\""
            }
        ];

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');

        function initQuiz() {
            // Render Questions
            let currentSection = "";
            
            quizData.forEach((item, index) => {
                // Insert Section Header if needed
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);
                }

                // Create Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Learning Objective (Masked)
                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.textContent = item.maskedLO;
                card.appendChild(loBox);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const [key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.textContent = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                // Check Button
                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                // Feedback Container
                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            // Load saved theme
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            changeTheme(savedTheme);
            themeSelect.value = savedTheme;

            // Load saved pin state
            const savedPinState = localStorage.getItem('headerPinned');
            // Default to true (pinned) if not set or if set to true
            if (savedPinState === 'false') {
                toggleHeader(false); 
            } else {
                toggleHeader(true);
            }
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const loEl = document.getElementById(`lo-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            // Reveal LO
            loEl.textContent = data.fullLO;

            // Generate Feedback HTML
            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('quizTheme', themeName);
        }

        function toggleHeader(forceState) {
            // Determine current state based on class presence
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            
            // If forceState is provided (boolean), use it. Otherwise toggle current state.
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                // Pin
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                // Unpin
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
